name: PC boot harness

on:
  push:
    paths:
      - "xbox_leak_may_2020/pc_port/**"
      - ".github/workflows/pc-harness.yml"
  pull_request:
    paths:
      - "xbox_leak_may_2020/pc_port/**"
      - ".github/workflows/pc-harness.yml"
  workflow_dispatch:

jobs:
  build-and-boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            xbox_leak_may_2020/pc_port
            xbox_leak_may_2020/xbox trunk/xbox/private/ntos/halx
          sparse-checkout-cone-mode: true
      - name: Test PE32 image inspector
        run: python3 -m unittest discover -s xbox_leak_may_2020/pc_port -p 'test_*.py' -v
      - name: Test PCI BAR decoder
        run: gcc -std=c11 -Wall -Wextra -Werror -Ixbox_leak_may_2020/pc_port xbox_leak_may_2020/pc_port/pc_pci.c xbox_leak_may_2020/pc_port/test_pc_pci.c -o /tmp/pc-pci-tests && /tmp/pc-pci-tests
      - name: Compile PCI BAR decoder for 32-bit freestanding target
        run: gcc -m32 -std=c11 -ffreestanding -fno-builtin -Wall -Wextra -Werror -Ixbox_leak_may_2020/pc_port -fsyntax-only xbox_leak_may_2020/pc_port/pc_pci.c
      - name: Test Intel integrated GPU discovery and generation classification
        run: gcc -std=c11 -Wall -Wextra -Werror -Ixbox_leak_may_2020/pc_port xbox_leak_may_2020/pc_port/pc_pci.c xbox_leak_may_2020/pc_port/pc_intel_gpu.c xbox_leak_may_2020/pc_port/test_pc_intel_gpu.c -o /tmp/pc-intel-gpu-tests && /tmp/pc-intel-gpu-tests
      - name: Compile Intel GPU discovery for 32-bit freestanding target
        run: gcc -m32 -std=c11 -ffreestanding -fno-builtin -Wall -Wextra -Werror -Ixbox_leak_may_2020/pc_port -fsyntax-only xbox_leak_may_2020/pc_port/pc_intel_gpu.c
      - name: Test ACPI RSDP and MADT parser
        run: gcc -std=c11 -Wall -Wextra -Werror -Ixbox_leak_may_2020/pc_port xbox_leak_may_2020/pc_port/pc_acpi.c xbox_leak_may_2020/pc_port/test_pc_acpi.c -o /tmp/pc-acpi-tests && /tmp/pc-acpi-tests
      - name: Compile ACPI parser for 32-bit freestanding target
        run: gcc -m32 -std=c11 -ffreestanding -fno-builtin -Wall -Wextra -Werror -Ixbox_leak_may_2020/pc_port -fsyntax-only xbox_leak_may_2020/pc_port/pc_acpi.c
      - name: Test x86 page-table builder
        run: gcc -std=c11 -Wall -Wextra -Werror -Ixbox_leak_may_2020/pc_port xbox_leak_may_2020/pc_port/pc_paging.c xbox_leak_may_2020/pc_port/test_pc_paging.c -o /tmp/pc-paging-tests && /tmp/pc-paging-tests
      - name: Test physical page allocator
        run: gcc -std=c11 -Wall -Wextra -Werror -Ixbox_leak_may_2020/pc_port xbox_leak_may_2020/pc_port/pc_physmem.c xbox_leak_may_2020/pc_port/test_pc_physmem.c -o /tmp/pc-physmem-tests && /tmp/pc-physmem-tests
      - name: Compile freestanding physical page allocator
        run: gcc -m32 -std=c11 -ffreestanding -fno-builtin -Wall -Wextra -Werror -Ixbox_leak_may_2020/pc_port -fsyntax-only xbox_leak_may_2020/pc_port/pc_physmem.c
      - name: Test PC HAL and NV2A bridge contracts
        run: >-
          gcc -std=c11 -Wall -Wextra -Werror -Ixbox_leak_may_2020/pc_port
          xbox_leak_may_2020/pc_port/pc_hal_contract.c
          xbox_leak_may_2020/pc_port/nv2a_pc_bridge.c
          xbox_leak_may_2020/pc_port/test_contracts.c
          -o /tmp/pc-port-contract-tests && /tmp/pc-port-contract-tests
      - name: Test NV2A shared-memory transport bounds
        run: gcc -std=c11 -Wall -Wextra -Werror -Ixbox_leak_may_2020/pc_port xbox_leak_may_2020/pc_port/nv2a_transport.c xbox_leak_may_2020/pc_port/test_nv2a_transport.c -o /tmp/nv2a-transport-tests && /tmp/nv2a-transport-tests
      - name: Test NV2A shared-ring dispatcher
        run: gcc -std=c11 -Wall -Wextra -Werror -Ixbox_leak_may_2020/pc_port xbox_leak_may_2020/pc_port/nv2a_transport.c xbox_leak_may_2020/pc_port/nv2a_dispatch.c xbox_leak_may_2020/pc_port/test_nv2a_dispatch.c -o /tmp/nv2a-dispatch-tests && /tmp/nv2a-dispatch-tests
      - name: Validate existing NV2A bridge ABI layout
        run: gcc -std=c11 -Wall -Wextra -Werror -fsyntax-only xbox_leak_may_2020/pc_port/test_nv2a_abi.c
      - name: Validate PC platform hypercall ABI
        run: gcc -std=c11 -Wall -Wextra -Werror -fsyntax-only xbox_leak_may_2020/pc_port/test_platform_abi.c
      - name: Install toolchain and emulator
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib grub-common grub-pc-bin xorriso mtools qemu-system-x86
      - name: Compile freestanding XboxRuntime XBE parser for 32-bit target
        run: g++ -m32 -std=c++17 -ffreestanding -fno-exceptions -fno-rtti -fno-builtin -Wall -Wextra -Werror -Ixbox_leak_may_2020/pc_port -fsyntax-only xbox_leak_may_2020/pc_port/xbe_format.cpp
      - name: Test 32-bit x86 page-table builder
        run: gcc -std=c11 -Wall -Wextra -Werror -Ixbox_leak_may_2020/pc_port xbox_leak_may_2020/pc_port/pc_paging.c xbox_leak_may_2020/pc_port/test_pc_paging.c -o /tmp/pc-paging-tests && /tmp/pc-paging-tests
      - name: Compile freestanding 32-bit page-table builder
        run: gcc -m32 -std=c11 -ffreestanding -fno-builtin -Wall -Wextra -Werror -Ixbox_leak_may_2020/pc_port -fsyntax-only xbox_leak_may_2020/pc_port/pc_paging.c
      - name: Test native PC Xbox kernel PE32 validator
        run: gcc -std=c11 -Wall -Wextra -Werror -Ixbox_leak_may_2020/pc_port xbox_leak_may_2020/pc_port/xbox_pc_boot.c xbox_leak_may_2020/pc_port/test_xbox_pc_boot.c -o /tmp/xbox-pc-boot-tests && /tmp/xbox-pc-boot-tests
      - name: Compile native PC Xbox kernel module validator
        run: gcc -m32 -std=c11 -ffreestanding -fno-builtin -Wall -Wextra -Werror -Ixbox_leak_may_2020/pc_port -fsyntax-only xbox_leak_may_2020/pc_port/xbox_pc_boot.c
      - name: Compile flat GDT implementation
        run: gcc -m32 -std=c11 -ffreestanding -fno-builtin -Wall -Wextra -Werror -Ixbox_leak_may_2020/pc_port -fsyntax-only xbox_leak_may_2020/pc_port/pc_gdt.c
      - name: Assemble exception entry stubs
        run: gcc -m32 -ffreestanding -fno-pie -Wall -Wextra -Werror -c xbox_leak_may_2020/pc_port/exception_stubs.S -o /tmp/exception_stubs.o
      - name: Compile PIT IRQ implementation
        run: gcc -m32 -std=c11 -ffreestanding -fno-builtin -Wall -Wextra -Werror -Ixbox_leak_may_2020/pc_port -fsyntax-only xbox_leak_may_2020/pc_port/pc_irq.c
      - name: Assemble IRQ entry stubs
        run: gcc -m32 -ffreestanding -fno-pie -Wall -Wextra -Werror -c xbox_leak_may_2020/pc_port/irq_stubs.S -o /tmp/irq_stubs.o
      - name: Compile PC exception IDT C implementation
        run: gcc -m32 -std=c11 -ffreestanding -fno-builtin -Wall -Wextra -Werror -Ixbox_leak_may_2020/pc_port -fsyntax-only xbox_leak_may_2020/pc_port/pc_idt.c
      - name: Compile native bare-metal PC HAL primitives
        run: gcc -m32 -std=c11 -ffreestanding -fno-builtin -Wall -Wextra -Werror -Ixbox_leak_may_2020/pc_port -fsyntax-only xbox_leak_may_2020/pc_port/pc_hal_native.c
      - name: Compile PC guest HAL VMCALL adapter
        run: gcc -m32 -std=c11 -Wall -Wextra -Werror -DPC_COMPAT_GUEST -Ixbox_leak_may_2020/pc_port -fsyntax-only xbox_leak_may_2020/pc_port/pc_hal_guest.c
      - name: Build standalone 32-bit harness
        working-directory: xbox_leak_may_2020/pc_port
        run: make CROSS= pc-harness.elf iso
      - name: Validate Multiboot header
        working-directory: xbox_leak_may_2020/pc_port
        run: grub-file --is-x86-multiboot pc-harness.elf
      - name: Boot the generated ISO in QEMU and verify serial diagnostics
        working-directory: xbox_leak_may_2020/pc_port
        shell: bash
        run: |
          test -s pc-port-harness.iso
          file pc-port-harness.iso
          set +e
          timeout 20s qemu-system-i386 -cdrom pc-port-harness.iso -boot d -display none -serial stdio -monitor none -no-reboot -no-shutdown > qemu.log 2>&1
          status=$?
          set -e
          cat qemu.log
          grep -F "PC-BOOT: placeholder VGA splash disabled; native Xbox ani2 path pending" qemu.log
          grep -F "PC-HAL: flat GDT installed" qemu.log
          grep -F "PC-HAL: exception IDT installed (vectors 0-31)" qemu.log
          grep -F "PC-HAL: native backend ABI contract PASS (PCI + PIC/PIT; MMIO unsupported)" qemu.log
          grep -F "PC-HARNESS: entered 32-bit bare-metal kernel" qemu.log
          grep -F "PC-HARNESS: Multiboot handoff PASS" qemu.log
          grep -F "PC-HAL: executing ring-0 native x86 hardware probes" qemu.log
          grep -F "PC-HAL: CPU vendor" qemu.log
          grep -F "PC-HAL: PCI device " qemu.log
          grep -F "PC-HAL: PCI functions found=" qemu.log
          grep -F "PC-HAL: physical allocator PASS page=" qemu.log
          grep -F "PC-HAL: Xbox 256 MiB identity + 0x80000000 alias tables verified (paging OFF)" qemu.log
          grep -F "PC-HAL: firmware LAPIC/IOAPIC MMIO mappings prepared uncached (paging OFF)" qemu.log
          grep -F "PC-HAL: physical allocator PASS page=" qemu.log
          grep -F "PC-HAL: PIT IRQ0 self-test PASS ticks=" qemu.log
          grep -F "PC-HAL: legacy PIC IRQ1 + IRQ12 dispatch/EOI self-test PASS" qemu.log
          grep -F "PC-HARNESS: native PC HAL probe PASS" qemu.log
          grep -F "NV2A: XboxRuntime freestanding microcode validator PASS" qemu.log
          grep -F "XBOX-BOOT: xboxkrnl.exe module not supplied" qemu.log
          grep -F "PC-HARNESS: stopping before Xbox kernel execution" qemu.log
          test "$status" -eq 124

      - name: Upload bootable PC HAL ISO
        uses: actions/upload-artifact@v4
        with:
          name: pc-port-harness-iso
          path: xbox_leak_may_2020/pc_port/pc-port-harness.iso
          if-no-files-found: error
          retention-days: 14
