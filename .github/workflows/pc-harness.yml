name: PC boot harness

on:
  push:
    paths:
      - "xbox_leak_may_2020/pc_port/**"
      - ".github/workflows/pc-harness.yml"
  pull_request:
    paths:
      - "xbox_leak_may_2020/pc_port/**"
      - ".github/workflows/pc-harness.yml"
  workflow_dispatch:

jobs:
  build-and-boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            xbox_leak_may_2020/pc_port
          sparse-checkout-cone-mode: true
      - name: Test PE32 image inspector
        run: python3 -m unittest discover -s xbox_leak_may_2020/pc_port -p 'test_*.py' -v
      - name: Test PC HAL and NV2A bridge contracts
        run: >-
          gcc -std=c11 -Wall -Wextra -Werror -Ixbox_leak_may_2020/pc_port
          xbox_leak_may_2020/pc_port/pc_hal_contract.c
          xbox_leak_may_2020/pc_port/nv2a_pc_bridge.c
          xbox_leak_may_2020/pc_port/test_contracts.c
          -o /tmp/pc-port-contract-tests && /tmp/pc-port-contract-tests
      - name: Test NV2A shared-memory transport bounds
        run: gcc -std=c11 -Wall -Wextra -Werror -Ixbox_leak_may_2020/pc_port xbox_leak_may_2020/pc_port/nv2a_transport.c xbox_leak_may_2020/pc_port/test_nv2a_transport.c -o /tmp/nv2a-transport-tests && /tmp/nv2a-transport-tests
      - name: Test NV2A shared-ring dispatcher
        run: gcc -std=c11 -Wall -Wextra -Werror -Ixbox_leak_may_2020/pc_port xbox_leak_may_2020/pc_port/nv2a_transport.c xbox_leak_may_2020/pc_port/nv2a_dispatch.c xbox_leak_may_2020/pc_port/test_nv2a_dispatch.c -o /tmp/nv2a-dispatch-tests && /tmp/nv2a-dispatch-tests
      - name: Validate existing NV2A bridge ABI layout
        run: gcc -std=c11 -Wall -Wextra -Werror -fsyntax-only xbox_leak_may_2020/pc_port/test_nv2a_abi.c
      - name: Validate PC platform hypercall ABI
        run: gcc -std=c11 -Wall -Wextra -Werror -fsyntax-only xbox_leak_may_2020/pc_port/test_platform_abi.c
      - name: Install toolchain and emulator
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib grub-common grub-pc-bin qemu-system-x86
      - name: Compile PC guest HAL VMCALL adapter
        run: gcc -m32 -std=c11 -Wall -Wextra -Werror -DPC_COMPAT_GUEST -Ixbox_leak_may_2020/pc_port -fsyntax-only xbox_leak_may_2020/pc_port/pc_hal_guest.c
      - name: Build standalone 32-bit harness
        working-directory: xbox_leak_may_2020/pc_port
        run: make CROSS=
      - name: Validate Multiboot header
        working-directory: xbox_leak_may_2020/pc_port
        run: grub-file --is-x86-multiboot pc-harness.elf
      - name: Boot in QEMU and verify serial diagnostics
        working-directory: xbox_leak_may_2020/pc_port
        shell: bash
        run: |
          set +e
          timeout 8s qemu-system-i386 -kernel pc-harness.elf -display none -serial stdio -monitor none -no-reboot -no-shutdown > qemu.log 2>&1
          status=$?
          set -e
          cat qemu.log
          grep -F "PC-HARNESS: entered 32-bit kernel" qemu.log
          grep -F "PC-HARNESS: Multiboot magic PASS" qemu.log
          grep -F "PC-HARNESS: serial PASS" qemu.log
          grep -F "PC-HARNESS: halting (Xbox kernel not loaded)" qemu.log
          test "$status" -eq 124
